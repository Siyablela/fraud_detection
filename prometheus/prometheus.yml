global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fraud-producer
    metrics_path: /metrics
    static_configs:
      - targets: ["producer:8001"]

  - job_name: fraud-query-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: fraud-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
