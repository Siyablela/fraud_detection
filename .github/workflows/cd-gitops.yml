name: CD GitOps

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "Dockerfile"
      - "requirements.txt"
      - "fraud-detection/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: cd-gitops-main
  cancel-in-progress: true

jobs:
  build-push-and-promote:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="${GITHUB_SHA}"
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_repo }}:main

      - name: Setup Python for values update
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Update prod Helm values with immutable image tag
        env:
          IMAGE_REPO: ${{ steps.meta.outputs.image_repo }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          values_path = Path("fraud-detection/values-prod.yaml")
          values = yaml.safe_load(values_path.read_text(encoding="utf-8"))

          image_repo = os.environ["IMAGE_REPO"]
          image_tag = os.environ["IMAGE_TAG"]

          for component in ("worker", "api", "producer"):
              values.setdefault(component, {}).setdefault("image", {})["repository"] = image_repo
              values[component]["image"]["tag"] = image_tag

          values_path.write_text(
              yaml.safe_dump(values, sort_keys=False),
              encoding="utf-8",
          )
          PY

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate rendered manifests
        run: |
          helm lint ./fraud-detection -f ./fraud-detection/values.yaml -f ./fraud-detection/values-prod.yaml
          helm template fraud-system ./fraud-detection -f ./fraud-detection/values.yaml -f ./fraud-detection/values-prod.yaml > /tmp/fraud-render.yaml

      - name: Commit promoted image tag
        run: |
          if git diff --quiet -- fraud-detection/values-prod.yaml; then
            echo "No values changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fraud-detection/values-prod.yaml
          git commit -m "chore(cd): promote image tag ${GITHUB_SHA} [skip ci]"
          git push
