name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - name: Lint
        run: ruff check app tests scripts alembic
      - name: Formatting
        run: ruff format --check app tests scripts alembic
      - name: Dependency vulnerabilities
        run: pipx run pip-audit==2.9.0 --strict --disable-pip --requirement requirements.lock

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - name: Migrations match the models
        run: |
          docker run -d --name ci-postgres -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci -p 5432:5432 postgres:16.4-alpine
          until docker exec ci-postgres pg_isready -U postgres -d ci; do sleep 1; done
          export DATABASE_URL=postgresql://postgres:ci@localhost:5432/ci
          alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Unit and integration tests (integration tests start their own containers)
        env:
          REQUIRE_DOCKER: "1"   # never skip integration tests in CI
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fraud-detection:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id fraud-detection:ci -u)" = "10001"
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fraud-detection:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compose file is valid
        run: cp .env.example .env && docker compose config --quiet

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4.3.0
      - name: Lint and render
        run: |
          helm lint ./fraud-detection -f ./fraud-detection/values.yaml -f ./fraud-detection/values-prod.yaml
          helm template fraud-system ./fraud-detection \
            -f ./fraud-detection/values.yaml -f ./fraud-detection/values-prod.yaml > /tmp/fraud-render.yaml
      - name: Validate against Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/fraud-render.yaml
