name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-validate:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile key Python modules
        run: |
          python -m py_compile \
            app/api.py \
            app/worker.py \
            app/security.py \
            app/kafka_security.py \
            app/settings.py \
            integration_test.py

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint and render Helm chart
        run: |
          helm lint ./fraud-detection -f ./fraud-detection/values.yaml -f ./fraud-detection/values-prod.yaml
          helm template fraud-system ./fraud-detection -f ./fraud-detection/values.yaml -f ./fraud-detection/values-prod.yaml > /tmp/fraud-render.yaml
