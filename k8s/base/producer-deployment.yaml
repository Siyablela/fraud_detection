apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-producer
  labels:
    app.kubernetes.io/name: fraud-producer
    app.kubernetes.io/part-of: fraud-detection
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-producer
        app.kubernetes.io/part-of: fraud-detection
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: producer
          image: fraud-detection:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.producer:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          env:
            # Swapped from REDIS_URL to Kafka connection parameters
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
