apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  labels:
    app.kubernetes.io/name: fraud-api
    app.kubernetes.io/part-of: fraud-detection
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-api
        app.kubernetes.io/part-of: fraud-detection
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: fraud-detection:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-redis
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-postgres
                  key: DATABASE_URL
            - name: FRAUD_RULES_CONFIG_PATH
              value: /config/rules.json
          volumeMounts:
            - name: rules
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: rules
          configMap:
            name: fraud-rules
