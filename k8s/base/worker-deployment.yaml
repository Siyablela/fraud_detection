apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-worker
  labels:
    app.kubernetes.io/name: fraud-worker
    app.kubernetes.io/part-of: fraud-detection
spec:
  # Upgraded: Safe to run multiple worker instances now using Kafka Consumer Groups
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-worker
        app.kubernetes.io/part-of: fraud-detection
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: fraud-detection:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "-m", "app.worker"]
          env:
            # Added: Connection to the Kubernetes Kafka ClusterIP Service
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            # Preserved: Redis remains for microsecond-level state tracking
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-redis
                  key: REDIS_URL
            # Preserved: System-of-record connection database strings
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-postgres
                  key: DATABASE_URL
            - name: FRAUD_RULES_CONFIG_PATH
              value: /config/rules.json
          volumeMounts:
            - name: rules
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: rules
          configMap:
            name: fraud-rules
