apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-worker
  labels:
    app.kubernetes.io/name: fraud-worker
    app.kubernetes.io/part-of: fraud-detection
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-worker
        app.kubernetes.io/part-of: fraud-detection
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: fraud-detection:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "-m", "app.worker"]
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-redis
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-postgres
                  key: DATABASE_URL
            - name: FRAUD_RULES_CONFIG_PATH
              value: /config/rules.json
          volumeMounts:
            - name: rules
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: rules
          configMap:
            name: fraud-rules
