# Single-process Loki for local use: filesystem storage inside the container, kept
# for 48 hours. Production would use object storage and a managed or HA Loki.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 48h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
