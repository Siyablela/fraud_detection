# Local Prometheus for `docker compose --profile monitoring up`: scrapes the worker and
# the API on the Compose network. In Kubernetes, the chart's pod annotations and
# PrometheusRule (fraud-detection/templates/alerting.yaml) do this instead.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: fraud-worker
    static_configs:
      - targets: ["worker:9100"]
  - job_name: fraud-query-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
