global:
  environment: dev

# Image built locally: docker build -t fraud-detection:dev .
image:
  repository: fraud-detection
  tag: dev
  pullPolicy: Never

inClusterDependencies:
  enabled: true

config:
  logLevel: DEBUG

kong:
  service:
    type: NodePort
    port: 80
    targetPort: 8000

resilience:
  enablePreferredAntiAffinity: false
  autoscaling:
    enabled: false

alerting:
  enabled: false
