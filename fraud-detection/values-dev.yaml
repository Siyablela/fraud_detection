global:
  environment: dev

worker:
  replicaCount: 1
  image:
    repository: fraud-detection
    tag: dev
    pullPolicy: Never

api:
  replicaCount: 1
  image:
    repository: fraud-detection
    tag: dev
    pullPolicy: Never

security:
  jwtIssuer: http://localhost:8081/realms/fraud
  jwtAudience: fraud-api
  jwtJwksUrl: http://localhost:8081/realms/fraud/protocol/openid-connect/certs
  authTokenEndpointEnabled: true

ksfkaSecurity:
  protocol: PLAINTEXT

kong:
  service:
    type: NodePort
    port: 80
    targetPort: 8000
    nodePort: null
  ingress:
    enabled: false

resilience:
  autoscaling:
    enabled: false