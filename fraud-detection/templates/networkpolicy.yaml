{{- if .Values.networkPolicy.enabled}}
# Default-deny ingress to the API pod, then allow only:
# - The kong gateway (application traffic) and
# - Prometheus (metric scraping on the app port).
# This keeps unauthenticated /metric endpoint reachanble only by the scraper,
# not by arbitrary in-cluster workloads, and prevents direct bypass of the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-api
  labels:
    app: fraud-api
spec:
  podSelector:
    matchLabels:
      app: fraud-api
    policyTypes:
      - Ingress
    ingress:
    # Application traffic from kong gateway
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayPodLabelsn| nindent 14}}
      ports:
        - protocol: TCP
          port: 8000
    # Metric scraping from Prometheus.
    - from:
        - namespaceSelector:
          matchLabels:
            {{- toYaml .Values.networkPolicy.prometheus.namespaceLabels | nindent 14}}
          podSelector:
            matchLabels:
            {{- toYaml .Values.networkPolicy.prometheus.podLabels | nindent 14}}
      ports:
        - protocol: TCP
          port: 8000
{{- end}}


