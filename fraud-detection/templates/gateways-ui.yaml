# --- KONG ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
spec:
  replicas: {{ .Values.kong.replicaCount }}
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.resilience.enablePreferredAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.resilience.topologyKey | quote }}
                labelSelector:
                  matchLabels:
                    app: kong
      {{- end }}
      containers:
        - name: kong
          image: {{ .Values.kong.image }}
          ports:
            - containerPort: 8000
              name: proxy
            - containerPort: 8100
              name: status
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml.tpl
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_LISTEN
              value: 127.0.0.1:8001
          readinessProbe:
            httpGet:
              path: /status
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /status
              port: 8100
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: kong-volume
              mountPath: /kong/kong.yml.tpl
              subPath: kong.yml.tpl
      volumes:
        - name: kong-volume
          configMap:
            name: fraud-configs
---
apiVersion: v1
kind: Service
metadata:
  name: kong
spec:
  type: {{ .Values.kong.service.type }}
  ports:
    - name: proxy
      port: {{ .Values.kong.service.port }}
      targetPort: {{ .Values.kong.service.targetPort }}
{{- if and (eq .Values.kong.service.type "NodePort") .Values.kong.service.nodePort }}
      nodePort: {{ .Values.kong.service.nodePort }}
{{- end }}
  selector:
    app: kong

{{- if .Values.kong.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong
  {{- if .Values.kong.ingress.annotations }}
  annotations:
    {{- toYaml .Values.kong.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.kong.ingress.className }}
  ingressClassName: {{ .Values.kong.ingress.className }}
  {{- end }}
  rules:
  {{- range .Values.kong.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: kong
                port:
                  number: {{ $.Values.kong.service.port }}
        {{- end }}
  {{- end }}
  {{- if .Values.kong.ingress.tls }}
  tls:
    {{- toYaml .Values.kong.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}

# --- KEYCLOAK ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: ["start-dev"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.security.keycloakAdminUsername | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ .Values.security.keycloakAdminPassword | quote }}
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  ports:
    - port: 8081
      targetPort: 8080
  selector:
    app: keycloak

# --- KAFKA UI ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka-ui
          image: {{ .Values.kafkaUi.image }}
          env:
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"
            - name: KAFKA_CLUSTERS_0_NAME
              value: "Local-Fraud-Cluster"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  ports:
    - port: 8080
  selector:
    app: kafka-ui
