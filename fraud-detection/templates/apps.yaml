# --- WORKER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: fraud-worker
  template:
    metadata:
      labels:
        app: fraud-worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 postgres 5432; do echo "Waiting for Postgres..."; sleep 2; done;']
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["python", "-u", "-m", "app.worker"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_NAME
              value: {{ .Values.appConfig.kafkaTopicName | quote }}
            - name: KAFKA_CONSUMER_GROUP_ID
              value: {{ .Values.appConfig.kafkaConsumerGroupId | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: postgres-password
            - name: DB_POOL_MIN_SIZE
              value: {{ .Values.appConfig.dbPoolMinSize | quote }}
            - name: DB_POOL_MAX_SIZE
              value: {{ .Values.appConfig.dbPoolMaxSize | quote }}
            - name: DEFAULT_HIGH_VALUE_THRESHOLD
              value: {{ .Values.appConfig.defaultHighValueThreshold | quote }}
            - name: DEFAULT_RESTRICTED_CATEGORIES
              value: {{ .Values.appConfig.defaultRestrictedCategoriesJson | quote }}
            - name: OBSERVABILITY_LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            - name: OBSERVABILITY_ENABLE_TRACING
              value: {{ .Values.observability.enableTracing | quote }}
            - name: WORKER_METRICS_PORT
              value: {{ .Values.observability.workerMetricsPort | quote }}
            - name: AUDIT_HASH_SECRET
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: audit-hash-secret
            - name: DATABASE_URL
              value: "postgresql://fraud_user:$(POSTGRES_PASSWORD)@postgres:5432/fraud_detection"
            - name: FRAUD_RULES_CONFIG_PATH
              value: "/config/rules.json"
          volumeMounts:
            - name: rules-volume
              mountPath: /config/rules.json
              subPath: rules.json
      volumes:
        - name: rules-volume
          configMap:
            name: fraud-configs

---
# --- API ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: fraud-api
  template:
    metadata:
      labels:
        app: fraud-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 postgres 5432; do echo "Waiting for Postgres..."; sleep 2; done;']
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: api-port
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: postgres-password
            - name: DB_POOL_MIN_SIZE
              value: {{ .Values.appConfig.dbPoolMinSize | quote }}
            - name: DB_POOL_MAX_SIZE
              value: {{ .Values.appConfig.dbPoolMaxSize | quote }}
            - name: DEFAULT_HIGH_VALUE_THRESHOLD
              value: {{ .Values.appConfig.defaultHighValueThreshold | quote }}
            - name: DEFAULT_RESTRICTED_CATEGORIES
              value: {{ .Values.appConfig.defaultRestrictedCategoriesJson | quote }}
            - name: OBSERVABILITY_LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            - name: OBSERVABILITY_ENABLE_TRACING
              value: {{ .Values.observability.enableTracing | quote }}
            - name: AUDIT_HASH_SECRET
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: audit-hash-secret
            - name: DATABASE_URL
              value: "postgresql://fraud_user:$(POSTGRES_PASSWORD)@postgres:5432/fraud_detection"
            - name: FRAUD_RULES_CONFIG_PATH
              value: "/config/rules.json"
          volumeMounts:
            - name: rules-volume
              mountPath: /config/rules.json
              subPath: rules.json
      volumes:
        - name: rules-volume
          configMap:
            name: fraud-configs
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  ports:
    - port: 8000
  selector:
    app: fraud-api

---
# --- PRODUCER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-producer
spec:
  replicas: {{ .Values.producer.replicaCount }}
  selector:
    matchLabels:
      app: fraud-producer
  template:
    metadata:
      labels:
        app: fraud-producer
    spec:
      containers:
        - name: producer
          image: "{{ .Values.producer.image.repository }}:{{ .Values.producer.image.tag }}"
          imagePullPolicy: {{ .Values.producer.image.pullPolicy }}
          command: ["uvicorn", "app.producer:app", "--host", "0.0.0.0", "--port", "8001"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_NAME
              value: {{ .Values.appConfig.kafkaTopicName | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: postgres-password
            - name: DB_POOL_MIN_SIZE
              value: {{ .Values.appConfig.dbPoolMinSize | quote }}
            - name: DB_POOL_MAX_SIZE
              value: {{ .Values.appConfig.dbPoolMaxSize | quote }}
            - name: DATABASE_URL
              value: "postgresql://fraud_user:$(POSTGRES_PASSWORD)@postgres:5432/fraud_detection"
            - name: OBSERVABILITY_LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            - name: OBSERVABILITY_ENABLE_TRACING
              value: {{ .Values.observability.enableTracing | quote }}
            - name: AUDIT_HASH_SECRET
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: audit-hash-secret
            - name: FRAUD_RULES_CONFIG_PATH
              value: "/config/rules.json"
            - name: DEFAULT_HIGH_VALUE_THRESHOLD
              value: {{ .Values.appConfig.defaultHighValueThreshold | quote }}
            - name: DEFAULT_RESTRICTED_CATEGORIES
              value: {{ .Values.appConfig.defaultRestrictedCategoriesJson | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: producer
spec:
  ports:
    - port: 8001
  selector:
    app: fraud-producer
