{{- $tracingEnabled := or .Values.observability.enableTracing .Values.instana.enabled -}}
{{- $otlpEndpoint := ternary .Values.instana.otlpEndpoint .Values.observability.otlpEndpoint .Values.instana.enabled -}}

# --- WORKER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: fraud-worker
  template:
    metadata:
      labels:
        app: fraud-worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 postgres 5432; do echo "Waiting for Postgres..."; sleep 2; done;']
        - name: wait-for-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 redis 6379; do echo "Waiting for Redis..."; sleep 2; done;']
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["python", "-u", "-m", "app.worker"]
          ports:
            - containerPort: {{ .Values.observability.workerMetricsPort }}
              name: metrics
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_NAME
              value: {{ .Values.appConfig.kafkaTopicName | quote }}
            - name: KAFKA_CONSUMER_GROUP_ID
              value: {{ .Values.appConfig.kafkaConsumerGroupId | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: postgres-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: DATABASE_URL
              value: "postgresql://fraud_user:$(POSTGRES_PASSWORD)@postgres:5432/fraud_detection"
            - name: FRAUD_RULES_CONFIG_PATH
              value: "/config/rules.json"
            - name: DB_POOL_MIN_SIZE
              value: {{ .Values.appConfig.dbPoolMinSize | quote }}
            - name: DB_POOL_MAX_SIZE
              value: {{ .Values.appConfig.dbPoolMaxSize | quote }}
            - name: VELOCITY_WINDOW_SECONDS
              value: {{ .Values.appConfig.velocityWindowSeconds | quote }}
            - name: DEFAULT_HIGH_VALUE_THRESHOLD
              value: {{ .Values.appConfig.defaultHighValueThreshold | quote }}
            - name: DEFAULT_VELOCITY_THRESHOLD
              value: {{ .Values.appConfig.defaultVelocityThreshold | quote }}
            - name: DEFAULT_RESTRICTED_CATEGORIES
              value: {{ .Values.appConfig.defaultRestrictedCategoriesJson | quote }}
            - name: OBSERVABILITY_LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            - name: OBSERVABILITY_ENABLE_TRACING
              value: {{ ternary "true" "false" $tracingEnabled | quote }}
            - name: WORKER_METRICS_PORT
              value: {{ .Values.observability.workerMetricsPort | quote }}
            {{- if and $tracingEnabled $otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $otlpEndpoint | quote }}
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: rules-volume
              mountPath: /config/rules.json
              subPath: rules.json
      volumes:
        - name: rules-volume
          configMap:
            name: fraud-configs

apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
spec:
  ports:
    - name: metrics
      port: {{ .Values.observability.workerMetricsPort }}
      targetPort: metrics
  selector:
    app: fraud-worker

---
# --- API ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: fraud-api
  template:
    metadata:
      labels:
        app: fraud-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 postgres 5432; do echo "Waiting for Postgres..."; sleep 2; done;']
        - name: wait-for-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 redis 6379; do echo "Waiting for Redis..."; sleep 2; done;']
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: api-port
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: postgres-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-secrets
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: DATABASE_URL
              value: "postgresql://fraud_user:$(POSTGRES_PASSWORD)@postgres:5432/fraud_detection"
            - name: FRAUD_RULES_CONFIG_PATH
              value: "/config/rules.json"
            - name: DB_POOL_MIN_SIZE
              value: {{ .Values.appConfig.dbPoolMinSize | quote }}
            - name: DB_POOL_MAX_SIZE
              value: {{ .Values.appConfig.dbPoolMaxSize | quote }}
            - name: DEFAULT_HIGH_VALUE_THRESHOLD
              value: {{ .Values.appConfig.defaultHighValueThreshold | quote }}
            - name: DEFAULT_VELOCITY_THRESHOLD
              value: {{ .Values.appConfig.defaultVelocityThreshold | quote }}
            - name: DEFAULT_RESTRICTED_CATEGORIES
              value: {{ .Values.appConfig.defaultRestrictedCategoriesJson | quote }}
            - name: OBSERVABILITY_LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            - name: OBSERVABILITY_ENABLE_TRACING
              value: {{ ternary "true" "false" $tracingEnabled | quote }}
            {{- if and $tracingEnabled $otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $otlpEndpoint | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: api-port
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: api-port
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: rules-volume
              mountPath: /config/rules.json
              subPath: rules.json
      volumes:
        - name: rules-volume
          configMap:
            name: fraud-configs
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  ports:
    - name: http
      port: 8000
      targetPort: api-port
  selector:
    app: fraud-api

---
# --- PRODUCER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-producer
spec:
  replicas: {{ .Values.producer.replicaCount }}
  selector:
    matchLabels:
      app: fraud-producer
  template:
    metadata:
      labels:
        app: fraud-producer
    spec:
      containers:
        - name: producer
          image: "{{ .Values.producer.image.repository }}:{{ .Values.producer.image.tag }}"
          imagePullPolicy: {{ .Values.producer.image.pullPolicy }}
          command: ["uvicorn", "app.producer:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
              name: producer-port
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_NAME
              value: {{ .Values.appConfig.kafkaTopicName | quote }}
            - name: OBSERVABILITY_LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            - name: OBSERVABILITY_ENABLE_TRACING
              value: {{ ternary "true" "false" $tracingEnabled | quote }}
            {{- if and $tracingEnabled $otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $otlpEndpoint | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: producer-port
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: producer-port
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: producer
spec:
  ports:
    - name: http
      port: 8001
      targetPort: producer-port
  selector:
    app: fraud-producer
