---
# ==========================
# FRAUD WORKER DEPLOYMENT
# ==========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-worker

spec:
  replicas: {{ .Values.worker.replicaCount }}

  selector:
    matchLabels:
      app: fraud-worker

  template:
    metadata:
      labels:
        app: fraud-worker

    spec:

      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}

      {{- if .Values.resilience.enablePreferredAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.resilience.topologyKey | quote }}
                labelSelector:
                  matchLabels:
                    app: fraud-worker
      {{- end }}

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z -v -w3 postgres 5432; do echo "Waiting for Postgres..."; sleep 2; done

      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}

          command:
            - python
            - -u
            - -m
            - app.worker

          resources:
{{- toYaml .Values.worker.resources | nindent 12 }}

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f "python -u -m app.worker" >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          env:

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

            - name: KAFKA_TOPIC_NAME
              value: {{ .Values.appConfig.kafkaTopicName | quote }}

            - name: KAFKA_DLQ_TOPIC_NAME
              value: {{ .Values.appConfig.kafkaDlqTopicName | quote }}

            - name: KAFKA_CONSUMER_GROUP_ID
              value: {{ .Values.appConfig.kafkaConsumerGroupId | quote }}

            - name: JWT_ISSUER
              value: {{ .Values.security.jwtIssuer | quote }}

            - name: JWT_AUDIENCE
              value: {{ .Values.security.jwtAudience | quote }}

            - name: JWT_JWKS_URL
              value: {{ .Values.security.jwtJwksUrl | quote }}

            - name: JWT_PUBLIC_KEY_PATH
              value: {{ .Values.security.jwtPublicKeyPath | quote }}

            - name: JWT_REQUIRED_SCOPE_FOR_TRANSACTION_READ
              value: {{ .Values.security.requiredReadScope | quote }}

            - name: JWT_ALGORITHMS
              value: {{ .Values.security.jwtAlgorithms | quote }}

            - name: AUTH_TOKEN_ENDPOINT_ENABLED
              value: {{ .Values.security.authTokenEndpointEnabled | quote }}

            - name: KEYCLOAK_ADMIN_URL
              value: {{ .Values.security.keycloakAdminUrl | quote }}

            - name: KEYCLOAK_DEMO_USERNAME
              value: {{ .Values.security.keycloakDemoUsername | quote }}

            - name: KEYCLOAK_TOKEN_CLIENT_ID
              value: {{ .Values.security.keycloakTokenClientId | quote }}

            - name: KEYCLOAK_SERVICE_CLIENT_ID
              value: {{ .Values.security.keycloakServiceClientId | quote }}

            - name: KEYCLOAK_TOKEN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: keycloak-token-client-secret

            - name: KEYCLOAK_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: keycloak-service-client-secret

            - name: KEYCLOAK_DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: keycloak-demo-password

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: postgres-password

            - name: DATABASE_URL
              value: "postgresql://fraud_user:$(POSTGRES_PASSWORD)@postgres:5432/fraud_detection"

            - name: FRAUD_RULES_CONFIG_PATH
              value: "/config/rules.json"

            - name: DB_POOL_MIN_SIZE
              value: {{ .Values.appConfig.dbPoolMinSize | quote }}

            - name: DB_POOL_MAX_SIZE
              value: {{ .Values.appConfig.dbPoolMaxSize | quote }}

            - name: DEFAULT_HIGH_VALUE_THRESHOLD
              value: {{ .Values.appConfig.defaultHighValueThreshold | quote }}

            - name: DEFAULT_RESTRICTED_CATEGORIES
              value: {{ .Values.appConfig.defaultRestrictedCategoriesJson | quote }}

            - name: OBSERVABILITY_LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}

            - name: OBSERVABILITY_ENABLE_TRACING
              value: {{ .Values.observability.enableTracing | quote }}

            - name: WORKER_METRICS_PORT
              value: {{ .Values.observability.workerMetricsPort | quote }}

          volumeMounts:
            - name: rules-volume
              mountPath: /config/rules.json
              subPath: rules.json

      volumes:
        - name: rules-volume
          configMap:
            name: fraud-configs

---
# ==========================
# FRAUD BATCH WORKER CRONJOB
# ==========================

{{- if .Values.batch.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fraud-batch-worker

spec:
  schedule: "{{ .Values.batch.runMinute }} {{ .Values.batch.runHour }} * * *"
  suspend: {{ .Values.batch.suspend }}
  successfulJobsHistoryLimit: {{ .Values.batch.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.batch.failedJobsHistoryLimit }}

  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: fraud-batch-worker

        spec:
          restartPolicy: OnFailure

          initContainers:
            - name: wait-for-postgres
              image: busybox:1.36

          containers:
            - name: batch-worker
              image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
              imagePullPolicy: {{ .Values.worker.image.pullPolicy }}

              command:
                - python
                - -u
                - -m
                - app.batch_worker

              resources:
{{- toYaml .Values.batch.resources | nindent 16 }}

              env:
                - name: BATCH_JOB_ENABLED
                  value: "true"

                - name: BATCH_RUN_HOUR
                  value: {{ .Values.batch.runHour | quote }}

                - name: BATCH_RUN_MINUTE
                  value: {{ .Values.batch.runMinute | quote }}
{{- end }}

---
# ==========================
# API DEPLOYMENT
# ==========================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: fraud-api

spec:
  replicas: {{ .Values.api.replicaCount }}

  selector:
    matchLabels:
      app: fraud-api

  template:
    metadata:
      labels:
        app: fraud-api

    spec:

      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36

      containers:
        - name: api

          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"

          ports:
            - containerPort: 8000
              name: api-port

          resources:
{{- toYaml .Values.api.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20

          env:
            - name: JWT_ISSUER
              value: {{ .Values.security.jwtIssuer | quote }}

            - name: JWT_AUDIENCE
              value: {{ .Values.security.jwtAudience | quote }}

            - name: JWT_JWKS_URL
              value: {{ .Values.security.jwtJwksUrl | quote }}

            - name: JWT_PUBLIC_KEY_PATH
              value: {{ .Values.security.jwtPublicKeyPath | quote }}

            - name: JWT_REQUIRED_SCOPE_FOR_TRANSACTION_READ
              value: {{ .Values.security.requiredReadScope | quote }}

            - name: JWT_ALGORITHMS
              value: {{ .Values.security.jwtAlgorithms | quote }}

            - name: KEYCLOAK_TOKEN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: keycloak-token-client-secret

            - name: KEYCLOAK_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: keycloak-service-client-secret

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: postgres-password

            - name: DATABASE_URL
              value: "postgresql://fraud_user:$(POSTGRES_PASSWORD)@postgres:5432/fraud_detection"

            - name: FRAUD_RULES_CONFIG_PATH
              value: "/config/rules.json"

          volumeMounts:
            - name: rules-volume
              mountPath: /config/rules.json
              subPath: rules.json

      volumes:
        - name: rules-volume
          configMap:
            name: fraud-configs

---
# ==========================
# API SERVICE
# ==========================

apiVersion: v1
kind: Service

metadata:
  name: api

spec:
  ports:
    - port: 8000

  selector:
    app: fraud-api