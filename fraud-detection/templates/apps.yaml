{{- $image := include "fraud-detection.image" . }}
{{- if .Values.migrations.enabled }}
# Schema migrations run before every upgrade (and before install when the database
# already exists); the release fails if they do. With in-cluster dependencies the
# database is created by this release, so the first install migrates post-install.
apiVersion: batch/v1
kind: Job
metadata:
  name: fraud-migrate
  labels: {{- include "fraud-detection.labels" (dict "root" . "component" "fraud-migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: {{ ternary "post-install,pre-upgrade" "pre-install,pre-upgrade" .Values.inClusterDependencies.enabled }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {{- include "fraud-detection.labels" (dict "root" . "component" "fraud-migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{- include "fraud-detection.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          securityContext: {{- include "fraud-detection.containerSecurityContext" . | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: database-url
          resources: {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-worker
  labels: {{- include "fraud-detection.labels" (dict "root" . "component" "fraud-worker") | nindent 4 }}
spec:
  {{- if not .Values.resilience.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: fraud-worker
  # A new consumer must join before an old one leaves, or partitions sit unowned.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- include "fraud-detection.labels" (dict "root" . "component" "fraud-worker") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      automountServiceAccountToken: false
      # Longer than WORKER_SHUTDOWN_TIMEOUT_SECONDS so in-flight messages finish.
      terminationGracePeriodSeconds: {{ add .Values.worker.shutdownTimeoutSeconds 10 }}
      securityContext: {{- include "fraud-detection.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.resilience.enablePreferredAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.resilience.topologyKey | quote }}
                labelSelector:
                  matchLabels: { app: fraud-worker }
      {{- end }}
      containers:
        - name: worker
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          securityContext: {{- include "fraud-detection.containerSecurityContext" . | nindent 12 }}
          ports:
            - { name: metrics, containerPort: 9100 }
          env:
            {{- include "fraud-detection.appEnv" . | nindent 12 }}
            - name: WORKER_SHUTDOWN_TIMEOUT_SECONDS
              value: {{ .Values.worker.shutdownTimeoutSeconds | quote }}
          # The poll loop touches a heartbeat file; a wedged loop stops touching it.
          livenessProbe:
            exec:
              command: ["python", "-m", "app.healthcheck", "worker"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  labels: {{- include "fraud-detection.labels" (dict "root" . "component" "fraud-api") | nindent 4 }}
spec:
  {{- if not .Values.resilience.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: fraud-api
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- include "fraud-detection.labels" (dict "root" . "component" "fraud-api") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {{- include "fraud-detection.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.resilience.enablePreferredAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.resilience.topologyKey | quote }}
                labelSelector:
                  matchLabels: { app: fraud-api }
      {{- end }}
      containers:
        - name: api
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header",
             "--timeout-graceful-shutdown", "20"]
          securityContext: {{- include "fraud-detection.containerSecurityContext" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            {{- include "fraud-detection.appEnv" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Ready only when PostgreSQL and Redis answer: no traffic to a pod that would 503.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness checks the process only, so a database outage does not restart every pod.
          livenessProbe:
            httpGet: { path: /live, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "fraud-detection.labels" (dict "root" . "component" "fraud-api") | nindent 4 }}
spec:
  selector:
    app: fraud-api
  ports:
    - { name: http, port: 8000, targetPort: http }
{{- if .Values.batch.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fraud-batch-summary
  labels: {{- include "fraud-detection.labels" (dict "root" . "component" "fraud-batch-summary") | nindent 4 }}
spec:
  schedule: {{ printf "%d %d * * *" (int .Values.batch.runMinute) (int .Values.batch.runHour) | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  suspend: {{ .Values.batch.suspend }}
  successfulJobsHistoryLimit: {{ .Values.batch.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.batch.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {{- include "fraud-detection.labels" (dict "root" . "component" "fraud-batch-summary") | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext: {{- include "fraud-detection.podSecurityContext" . | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: batch-summary
              image: {{ $image }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "app.batch_worker", "--once"]
              securityContext: {{- include "fraud-detection.containerSecurityContext" . | nindent 16 }}
              env:
                {{- include "fraud-detection.appEnv" . | nindent 16 }}
              resources: {{- toYaml .Values.batch.resources | nindent 16 }}
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: tmp, emptyDir: {} }
{{- end }}
