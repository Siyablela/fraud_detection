# --- WORKER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: fraud-worker
  template:
    metadata:
      labels:
        app: fraud-worker
    spec:
      {{- if .Values.resilience.enablePreferredAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.resilience.topologyKey | quote }}
                labelSelector:
                  matchLabels:
                    app: fraud-worker
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 postgres 5432; do echo "Waiting for Postgres..."; sleep 2; done;']
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["python", "-u", "-m", "app.worker"]
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f "python -u -m app.worker" >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_NAME
              value: {{ .Values.appConfig.kafkaTopicName | quote }}
            - name: KAFKA_DLQ_TOPIC_NAME
              value: {{ .Values.appConfig.kafkaDlqTopicName | quote }}
            - name: KAFKA_CONSUMER_GROUP_ID
              value: {{ .Values.appConfig.kafkaConsumerGroupId | quote }}
            - name: JWT_ISSUER
              value: {{ .Values.security.jwtIssuer | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.security.jwtAudience | quote }}
            - name: JWT_JWKS_URL
              value: {{ .Values.security.jwtJwksUrl | quote }}
            - name: JWT_PUBLIC_KEY_PATH
              value: {{ .Values.security.jwtPublicKeyPath | quote }}
            - name: JWT_REQUIRED_SCOPE_FOR_TRANSACTION_READ
              value: {{ .Values.security.requiredReadScope | quote }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.kafkaSecurity.protocol | quote }}
            - name: KAFKA_SSL_TRUSTSTORE_PATH
              value: {{ .Values.kafkaSecurity.truststorePath | quote }}
            - name: KAFKA_SSL_KEYSTORE_CERT_PATH
              value: {{ .Values.kafkaSecurity.keystoreCertPath | quote }}
            - name: KAFKA_SSL_KEYSTORE_KEY_PATH
              value: {{ .Values.kafkaSecurity.keystoreKeyPath | quote }}
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: KAFKA_SSL_KEYSTORE_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql://fraud_user:$(POSTGRES_PASSWORD)@postgres:5432/fraud_detection"
            - name: FRAUD_RULES_CONFIG_PATH
              value: "/config/rules.json"
            - name: DB_POOL_MIN_SIZE
              value: {{ .Values.appConfig.dbPoolMinSize | quote }}
            - name: DB_POOL_MAX_SIZE
              value: {{ .Values.appConfig.dbPoolMaxSize | quote }}
            - name: DEFAULT_HIGH_VALUE_THRESHOLD
              value: {{ .Values.appConfig.defaultHighValueThreshold | quote }}
            - name: DEFAULT_RESTRICTED_CATEGORIES
              value: {{ .Values.appConfig.defaultRestrictedCategoriesJson | quote }}
            - name: OBSERVABILITY_LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            - name: OBSERVABILITY_ENABLE_TRACING
              value: {{ .Values.observability.enableTracing | quote }}
            - name: WORKER_METRICS_PORT
              value: {{ .Values.observability.workerMetricsPort | quote }}
          volumeMounts:
            - name: rules-volume
              mountPath: /config/rules.json
              subPath: rules.json
      volumes:
        - name: rules-volume
          configMap:
            name: fraud-configs

---
# --- API ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: fraud-api
  template:
    metadata:
      labels:
        app: fraud-api
    spec:
      {{- if .Values.resilience.enablePreferredAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.resilience.topologyKey | quote }}
                labelSelector:
                  matchLabels:
                    app: fraud-api
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 postgres 5432; do echo "Waiting for Postgres..."; sleep 2; done;']
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: api-port
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: JWT_ISSUER
              value: {{ .Values.security.jwtIssuer | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.security.jwtAudience | quote }}
            - name: JWT_JWKS_URL
              value: {{ .Values.security.jwtJwksUrl | quote }}
            - name: JWT_PUBLIC_KEY_PATH
              value: {{ .Values.security.jwtPublicKeyPath | quote }}
            - name: JWT_REQUIRED_SCOPE_FOR_TRANSACTION_READ
              value: {{ .Values.security.requiredReadScope | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC_NAME
              value: {{ .Values.appConfig.kafkaTopicName | quote }}
            - name: KAFKA_DLQ_TOPIC_NAME
              value: {{ .Values.appConfig.kafkaDlqTopicName | quote }}
            - name: KAFKA_CONSUMER_GROUP_ID
              value: {{ .Values.appConfig.kafkaConsumerGroupId | quote }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.kafkaSecurity.protocol | quote }}
            - name: KAFKA_SSL_TRUSTSTORE_PATH
              value: {{ .Values.kafkaSecurity.truststorePath | quote }}
            - name: KAFKA_SSL_KEYSTORE_CERT_PATH
              value: {{ .Values.kafkaSecurity.keystoreCertPath | quote }}
            - name: KAFKA_SSL_KEYSTORE_KEY_PATH
              value: {{ .Values.kafkaSecurity.keystoreKeyPath | quote }}
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: KAFKA_SSL_KEYSTORE_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql://fraud_user:$(POSTGRES_PASSWORD)@postgres:5432/fraud_detection"
            - name: FRAUD_RULES_CONFIG_PATH
              value: "/config/rules.json"
            - name: DB_POOL_MIN_SIZE
              value: {{ .Values.appConfig.dbPoolMinSize | quote }}
            - name: DB_POOL_MAX_SIZE
              value: {{ .Values.appConfig.dbPoolMaxSize | quote }}
            - name: DEFAULT_HIGH_VALUE_THRESHOLD
              value: {{ .Values.appConfig.defaultHighValueThreshold | quote }}
            - name: DEFAULT_RESTRICTED_CATEGORIES
              value: {{ .Values.appConfig.defaultRestrictedCategoriesJson | quote }}
            - name: OBSERVABILITY_LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            - name: OBSERVABILITY_ENABLE_TRACING
              value: {{ .Values.observability.enableTracing | quote }}
          volumeMounts:
            - name: rules-volume
              mountPath: /config/rules.json
              subPath: rules.json
      volumes:
        - name: rules-volume
          configMap:
            name: fraud-configs
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  ports:
    - port: 8000
  selector:
    app: fraud-api

