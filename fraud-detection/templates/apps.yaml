# --- WORKER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: fraud-worker
  template:
    metadata:
      labels:
        app: fraud-worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 postgres 5432; do echo "Waiting for Postgres..."; sleep 2; done;']
        - name: wait-for-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 redis 6379; do echo "Waiting for Redis..."; sleep 2; done;']
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["python", "-u", "-m", "app.worker"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.kafkaSecurity.protocol | quote }}
            - name: KAFKA_SSL_TRUSTSTORE_PATH
              value: {{ .Values.kafkaSecurity.truststorePath | quote }}
            - name: KAFKA_SSL_KEYSTORE_CERT_PATH
              value: {{ .Values.kafkaSecurity.keystoreCertPath | quote }}
            - name: KAFKA_SSL_KEYSTORE_KEY_PATH
              value: {{ .Values.kafkaSecurity.keystoreKeyPath | quote }}
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: KAFKA_SSL_KEYSTORE_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: postgres-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: DATABASE_URL
              value: "postgresql://fraud_user:$(POSTGRES_PASSWORD)@postgres:5432/fraud_detection"
            - name: FRAUD_RULES_CONFIG_PATH
              value: "/config/rules.json"
          volumeMounts:
            - name: rules-volume
              mountPath: /config/rules.json
              subPath: rules.json
      volumes:
        - name: rules-volume
          configMap:
            name: fraud-configs

---
# --- API ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: fraud-api
  template:
    metadata:
      labels:
        app: fraud-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 postgres 5432; do echo "Waiting for Postgres..."; sleep 2; done;']
        - name: wait-for-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z -v -w3 redis 6379; do echo "Waiting for Redis..."; sleep 2; done;']
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: api-port
          env:
            - name: JWT_ISSUER
              value: {{ .Values.security.jwtIssuer | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.security.jwtAudience | quote }}
            - name: JWT_JWKS_URL
              value: {{ .Values.security.jwtJwksUrl | quote }}
            - name: JWT_PUBLIC_KEY_PATH
              value: {{ .Values.security.jwtPublicKeyPath | quote }}
            - name: JWT_REQUIRED_SCOPE_FOR_TRANSACTION_READ
              value: {{ .Values.security.requiredReadScope | quote }}
            - name: JWT_REQUIRED_SCOPE_FOR_TRANSACTION_WRITE
              value: {{ .Values.security.requiredWriteScope | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: postgres-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: DATABASE_URL
              value: "postgresql://fraud_user:$(POSTGRES_PASSWORD)@postgres:5432/fraud_detection"
            - name: FRAUD_RULES_CONFIG_PATH
              value: "/config/rules.json"
          volumeMounts:
            - name: rules-volume
              mountPath: /config/rules.json
              subPath: rules.json
      volumes:
        - name: rules-volume
          configMap:
            name: fraud-configs
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  ports:
    - port: 8000
  selector:
    app: fraud-api

---
# --- PRODUCER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-producer
spec:
  replicas: {{ .Values.producer.replicaCount }}
  selector:
    matchLabels:
      app: fraud-producer
  template:
    metadata:
      labels:
        app: fraud-producer
    spec:
      containers:
        - name: producer
          image: "{{ .Values.producer.image.repository }}:{{ .Values.producer.image.tag }}"
          imagePullPolicy: {{ .Values.producer.image.pullPolicy }}
          command: ["uvicorn", "app.producer:app", "--host", "0.0.0.0", "--port", "8001"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.kafkaSecurity.protocol | quote }}
            - name: KAFKA_SSL_TRUSTSTORE_PATH
              value: {{ .Values.kafkaSecurity.truststorePath | quote }}
            - name: KAFKA_SSL_KEYSTORE_CERT_PATH
              value: {{ .Values.kafkaSecurity.keystoreCertPath | quote }}
            - name: KAFKA_SSL_KEYSTORE_KEY_PATH
              value: {{ .Values.kafkaSecurity.keystoreKeyPath | quote }}
            - name: KAFKA_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: KAFKA_SSL_KEYSTORE_PASSWORD
            - name: JWT_ISSUER
              value: {{ .Values.security.jwtIssuer | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.security.jwtAudience | quote }}
            - name: JWT_JWKS_URL
              value: {{ .Values.security.jwtJwksUrl | quote }}
            - name: JWT_PUBLIC_KEY_PATH
              value: {{ .Values.security.jwtPublicKeyPath | quote }}
            - name: JWT_REQUIRED_SCOPE_FOR_TRANSACTION_READ
              value: {{ .Values.security.requiredReadScope | quote }}
            - name: JWT_REQUIRED_SCOPE_FOR_TRANSACTION_WRITE
              value: {{ .Values.security.requiredWriteScope | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: producer
spec:
  ports:
    - port: 8001
  selector:
    app: fraud-producer
