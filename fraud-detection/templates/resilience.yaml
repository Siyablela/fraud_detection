{{- if .Values.resilience.podDisruptionBudget.enabled }}
{{- range $component := list "fraud-api" "fraud-worker" "kong" }}
---
# maxUnavailable (not minAvailable) so single-replica environments can still drain nodes.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $component }}-pdb
  labels: {{- include "fraud-detection.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  maxUnavailable: {{ $.Values.resilience.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels: { app: {{ $component }} }
{{- end }}
{{- end }}

{{- if .Values.resilience.autoscaling.enabled }}
{{- range $target := list (dict "name" "fraud-api" "values" .Values.resilience.autoscaling.api) (dict "name" "fraud-worker" "values" .Values.resilience.autoscaling.worker) (dict "name" "kong" "values" .Values.resilience.autoscaling.kong) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $target.name }}-hpa
  labels: {{- include "fraud-detection.labels" (dict "root" $ "component" $target.name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $target.name }}
  minReplicas: {{ $target.values.minReplicas }}
  maxReplicas: {{ $target.values.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $target.values.targetCPUUtilizationPercentage }} }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: {{ $target.values.targetMemoryUtilizationPercentage }} }
{{- end }}
{{- if gt (int .Values.resilience.autoscaling.worker.maxReplicas) (int .Values.inClusterDependencies.kafka.partitions) }}
{{- fail "resilience.autoscaling.worker.maxReplicas must not exceed the topic's partition count: extra consumers sit idle" }}
{{- end }}
{{- end }}

{{- if and .Values.certManager.enabled (.Capabilities.APIVersions.Has "cert-manager.io/v1/Certificate") }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fraud-api-tls
spec:
  secretName: {{ .Values.certManager.secretName }}
  issuerRef:
    kind: {{ .Values.certManager.issuerKind }}
    name: {{ .Values.certManager.issuerName }}
  dnsNames:
    - {{ .Values.certManager.ingressHost }}
{{- end }}
