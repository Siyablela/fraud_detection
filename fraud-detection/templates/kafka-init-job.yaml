apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topic
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: {{ .Values.kafka.image }}
          command: ["/bin/sh", "-c"]
          args:
            - >
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic {{ .Values.appConfig.kafkaTopicName }} ;
              /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic {{ .Values.appConfig.kafkaDlqTopicName }}

