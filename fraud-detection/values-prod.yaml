global:
  environment: prod

worker:
  replicaCount: 2
  image:
    repository: ghcr.io/siyablela/fraud_detection
    tag: IMAGE_TAG
    pullPolicy: IfNotPresent

api:
  replicaCount: 2
  image:
    repository: ghcr.io/siyablela/fraud_detection
    tag: IMAGE_TAG
    pullPolicy: IfNotPresent

security:
  jwtIssuer: https://auth.example.com/
  jwtAudience: fraud-api
  jwtJwksUrl: https://auth.example.com/.well-known/jwks.json
  jwtPublicKeyPath: ""
  requiredReadScope: fraud:transactions:read
  requiredWriteScope: fraud:transactions:write

kafkaSecurity:
  protocol: SSL
  truststorePath: /etc/kafka/tls/kafka-ca.pem
  keystoreCertPath: /etc/kafka/tls/kafka-client.crt
  keystoreKeyPath: /etc/kafka/tls/kafka-client.key

producer:
  replicaCount: 2
  image:
    repository: ghcr.io/siyablela/fraud_detection
    tag: IMAGE_TAG
    pullPolicy: IfNotPresent

kong:
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "1m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    hosts:
      - host: fraud-api.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
