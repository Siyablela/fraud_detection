global:
  environment: production

image:
  repository: ghcr.io/siyablela/fraud_detection
  tag: main
  pullPolicy: IfNotPresent

# Production uses managed, replicated PostgreSQL, Redis, Kafka and the corporate
# identity provider; database-url / redis-url in the Secret point at them.
inClusterDependencies:
  enabled: false
  kafka:
    partitions: 12

config:
  kafkaBootstrapServers: kafka-bootstrap.kafka.svc:9093
  kafkaSecurityProtocol: SASL_SSL
  kafkaOauthTokenUrl: https://auth.example.com/realms/fraud/protocol/openid-connect/token
  kafkaOauthClientId: fraud-worker
  jwtIssuer: https://auth.example.com/realms/fraud
  jwtJwksUrl: https://auth.example.com/realms/fraud/protocol/openid-connect/certs
  logLevel: INFO

api:
  replicaCount: 2

worker:
  replicaCount: 2

resilience:
  autoscaling:
    enabled: true
    api:
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    worker:
      minReplicas: 2
      maxReplicas: 12
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    kong:
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
certManager:
  enabled: true
  issuerKind: ClusterIssuer
  issuerName: letsencrypt-prod
  ingressHost: fraud-api.example.com
  secretName: fraud-api-tls
kong:
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 1m
      nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    hosts:
      - host: fraud-api.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts: [fraud-api.example.com]
        secretName: fraud-api-tls
