global:
  environment: production

# Application secrets are expected to come from a Kubernetes Secret.
# Populate this Secret outside the app, for example from Vault or another secret-sync mechanism.
secrets:
  existingSecretName: fraud-secrets

# Custom Internal Applications (Built from your local context)
worker:
  replicaCount: 1
  image:
    repository: fraud-worker
    tag: latest
    pullPolicy: IfNotPresent

api:
  replicaCount: 1
  image:
    repository: fraud-api
    tag: latest
    pullPolicy: IfNotPresent

batch:
  enabled: true
  runHour: 2
  runMinute: 0
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

security:
  jwtIssuer: https://auth.example.com/
  jwtAudience: fraud-api
  jwtJwksUrl: https://auth.example.com/.well-known/jwks.json
  jwtPublicKeyPath: ""
  jwtAlgorithms: RS256
  requiredReadScope: fraud:transactions:read
  authTokenEndpointEnabled: false
  keycloakAdminUrl: http://keycloak:8081
  keycloakAdminUsername: "{{ vault:secret/data/keycloak/admin#username }}"
  keycloakAdminPassword: "{{ vault:secret/data/keycloak/admin#password }}"
  keycloakDemoUsername: "{{ vault:secret/data/keycloak/demo#username }}"
  keycloakDemoPassword: "{{ vault:secret/data/keycloak/demo#password }}"
  keycloakTokenClientId: fraud-cli
  keycloakTokenClientSecret: "{{ vault:secret/data/keycloak/clients#token-client-secret }}"
  keycloakServiceClientId: fraud-service-cli
  keycloakServiceClientSecret: "{{ vault:secret/data/keycloak/clients#service-client-secret }}"
  keycloakServiceTokenScope: "{{ vault:secret/data/keycloak/clients#service-token-scope }}"

kafkaSecurity:
  protocol: SASL_PLAINTEXT

resilience:
  enablePreferredAntiAffinity: true
  topologyKey: kubernetes.io/hostname
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    api:
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    worker:
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    kong:
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

persistence:
  postgres:
    enabled: true
    accessMode: ReadWriteOnce
    size: 20Gi
    storageClassName: ""
  kafka:
    enabled: true
    accessMode: ReadWriteOnce
    size: 30Gi
    storageClassName: ""

certManager:
  enabled: false
  issuerKind: ClusterIssuer
  issuerName: ""
  ingressHost: fraud-api.example.com
  secretName: fraud-api-tls

appConfig:
  kafkaTopicName: transactions_topic
  kafkaDlqTopicName: transactions_topic.dlq
  kafkaConsumerGroupId: fraud-worker-group
  kafkaProducerAcks: all
  kafkaProducerEnableIdempotence: true
  dbPoolMinSize: 1
  dbPoolMaxSize: 10
  defaultHighValueThreshold: 10000
  defaultRestrictedCategoriesJson: '{"GAMBLING": 5000, "CRYPTO": 5000}'

observability:
  logLevel: INFO
  enableTracing: false
  workerMetricsPort: 9100
  otlpEndpoint: ""

alerting:
  enabled: true
  team: support
  owner: developers
  alertmanager:
    enabled: false
    smtp:
      enabled: false
      smarthost: "smtp.example.com:587"
      from: "fraud-alerts@example.com"
      to: "support@example.com"
      username: ""
      password: ""
      require_tls: true
    jarvis:
      enabled: false
      webhookUrl: ""
      username: ""
      password: ""
    teamsWebhookUrl: ""
    slackWebhookUrl: ""
    slackChannel: "#fraud-alerts"

instana:
  enabled: false
  otlpEndpoint: "http://instana-agent.instana-agent.svc.cluster.local:4318/v1/traces"

# Infrastructure Components (Third-Party Images)
postgres:
  image: postgres:16-alpine
kafka:
  image: apache/kafka:latest
  durability:
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    defaultReplicationFactor: 1
    minInSyncReplicas: 1
keycloak:
  image: quay.io/keycloak/keycloak:26.0
kong:
  image: kong:3.8
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
    nodePort: null
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: fraud-gateway.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
kafkaUi:
  image: ghcr.io/kafbat/kafka-ui:latest

# Application Configurations (Injected via ConfigMap)
rulesConfig: |
  {
    "example_rule": "fraud_rules_go_here"
  }

kongConfig: |
  _format_version: "3.0"
  services:
    - name: fraud-query-api
      url: http://api:8000
      routes:
        - name: query-transactions
          paths:
            - /api/v1/transactions
          methods:
            - GET
          strip_path: false
          plugins:
            - name: rate-limiting
              config:
                minute: 300
                policy: local
        - name: query-categories
          paths:
            - /api/v1/categories
          methods:
            - GET
          strip_path: false
          plugins:
            - name: rate-limiting
              config:
                minute: 120
                policy: local
  plugins:
    - name: correlation-id
      config:
        header_name: x-request-id
        generator: uuid
        echo_downstream: true

