global:
  environment: production

# Application secrets
secrets:
  existingSecretName: fraud-secrets

# Custom Internal Applications (Built from your local context)
worker:
  replicaCount: 1
  image:
    repository: fraud-worker
    tag: latest
    pullPolicy: IfNotPresent

api:
  replicaCount: 1
  image:
    repository: fraud-api
    tag: latest
    pullPolicy: IfNotPresent

security:
  jwtIssuer: https://auth.example.com/
  jwtAudience: fraud-api
  jwtJwksUrl: https://auth.example.com/.well-known/jwks.json
  jwtPublicKeyPath: ""
  requiredReadScope: fraud:transactions:read
  requiredWriteScope: fraud:transactions:write

kafkaSecurity:
  protocol: PLAINTEXT
  truststorePath: .secrets/kafka-ca.pem
  keystoreCertPath: .secrets/kafka-client.crt
  keystoreKeyPath: .secrets/kafka-client.key

producer:
  replicaCount: 1
  image:
    repository: fraud-producer
    tag: latest
    pullPolicy: IfNotPresent

appConfig:
  kafkaTopicName: transactions_topic
  kafkaConsumerGroupId: fraud-worker-group
  dbPoolMinSize: 1
  dbPoolMaxSize: 10
  velocityWindowSeconds: 60
  defaultHighValueThreshold: 10000
  defaultVelocityThreshold: 5
  defaultRestrictedCategoriesJson: '{"GAMBLING": 5000, "CRYPTO": 5000}'

observability:
  logLevel: INFO
  enableTracing: false
  workerMetricsPort: 9100
  otlpEndpoint: ""

instana:
  enabled: false
  otlpEndpoint: "http://instana-agent.instana-agent.svc.cluster.local:4318/v1/traces"

# Infrastructure Components (Third-Party Images)
postgres:
  image: postgres:16-alpine
redis:
  image: redis:latest
kafka:
  image: apache/kafka:latest
keycloak:
  image: quay.io/keycloak/keycloak:26.0
kong:
  image: kong:3.8
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
    nodePort: null
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: fraud-gateway.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
kafkaUi:
  image: ghcr.io/kafbat/kafka-ui:latest

# Application Configurations (Injected via ConfigMap)
rulesConfig: |
  {
    "example_rule": "fraud_rules_go_here"
  }

kongConfig: |
  _format_version: "3.0"
  services:
    - name: fraud-query-api
      url: http://api:8000
      routes:
        - name: query-transactions
          paths:
            - /api/v1/transactions
          methods:
            - GET
          strip_path: false
          plugins:
            - name: rate-limiting
              config:
                minute: 300
                policy: local
        - name: query-categories
          paths:
            - /api/v1/categories
          methods:
            - GET
          strip_path: false
          plugins:
            - name: rate-limiting
              config:
                minute: 120
                policy: local
        - name: query-users
          paths:
            - /api/v1/users
          methods:
            - GET
          strip_path: false
          plugins:
            - name: rate-limiting
              config:
                minute: 120
                policy: local
    - name: fraud-producer-api
      url: http://producer:8001
      routes:
        - name: ingest-transactions
          paths:
            - /api/v1/transactions
          methods:
            - POST
          strip_path: false
          plugins:
            - name: rate-limiting
              config:
                minute: 120
                policy: local

  plugins:
    - name: correlation-id
      config:
        header_name: x-request-id
        generator: uuid
        echo_downstream: true

