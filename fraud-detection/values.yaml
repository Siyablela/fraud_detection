# Defaults suit a development cluster. values-prod.yaml overrides for production.

global:
  environment: production

# One image runs every process (API, worker, batch job, migrations).
image:
  repository: ghcr.io/siyablela/fraud_detection
  tag: ""          # defaults to the chart appVersion; CD pins the commit SHA
  digest: ""       # optional; when set, used instead of the tag
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Every credential comes from this existing Secret (created by your secret store,
# e.g. External Secrets / Vault). Keys:
#   database-url, redis-url                      always
#   kafka-oauth-client-secret                    when config.kafkaSecurityProtocol is SASL_*
#   postgres-password, redis-password,
#   keycloak-admin-password,
#   fraud-analyst-client-secret,
#   fraud-rules-admin-client-secret              only with inClusterDependencies.enabled
secrets:
  existingSecretName: fraud-secrets

config:
  kafkaBootstrapServers: kafka:9092
  kafkaTopicName: transactions
  kafkaConsumerGroupId: fraud-worker
  kafkaSecurityProtocol: PLAINTEXT   # PLAINTEXT only for in-cluster dev; SSL or SASL_SSL elsewhere
  kafkaOauthTokenUrl: ""
  kafkaOauthClientId: ""
  jwtIssuer: http://keycloak:8080/realms/fraud
  jwtAudience: fraud-api
  jwtJwksUrl: http://keycloak:8080/realms/fraud/protocol/openid-connect/certs
  ruleSetKey: fraud-default
  corsAllowedOrigins: ""             # comma-separated; empty = no browser cross-origin access
  rateLimitRequests: 100             # per caller per minute
  logLevel: INFO
  enableTracing: false
  otlpEndpoint: ""

api:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: "1", memory: 512Mi }

worker:
  replicaCount: 1
  shutdownTimeoutSeconds: 25
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: "1", memory: 512Mi }

batch:
  enabled: true
  runHour: 2
  runMinute: 0
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

migrations:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

# Single-replica PostgreSQL, Redis, Kafka and Keycloak for dev/test clusters.
inClusterDependencies:
  enabled: true
  postgres:
    image: postgres:16.4-alpine
    database: fraud_detection
    user: fraud
    storage: 10Gi
    storageClassName: ""
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }
  redis:
    image: redis:7.4.1-alpine
    storage: 1Gi
    storageClassName: ""
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
  kafka:
    image: apache/kafka:3.9.0
    partitions: 6        # upper bound for useful worker replicas
    storage: 20Gi
    storageClassName: ""
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { cpu: "2", memory: 2Gi }
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    hostname: http://keycloak:8080   # must match config.jwtIssuer's origin
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }

kong:
  image: kong:3.8.0
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
    nodePort: null
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: fraud-gateway.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

networkPolicy:
  enabled: true
  gatewayPodLabels:
    app: kong
  prometheus:
    namespaceLabels: {}
    podLabels:
      app.kubernetes.io/name: prometheus

resilience:
  enablePreferredAntiAffinity: true
  topologyKey: kubernetes.io/hostname
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: false
    api:
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    worker:
      # A consumer group cannot use more consumers than partitions; the chart
      # refuses a maxReplicas above inClusterDependencies.kafka.partitions.
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    kong:
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

certManager:
  enabled: false
  issuerKind: ClusterIssuer
  issuerName: ""
  ingressHost: fraud-api.example.com
  secretName: fraud-api-tls

alerting:
  enabled: true
  team: support
  owner: developers
  alertmanager:
    enabled: false
    smtp:
      enabled: false
      smarthost: "smtp.example.com:587"
      from: "fraud-alerts@example.com"
      to: "support@example.com"
      username: ""
      password: ""
      require_tls: true
    jarvis:
      enabled: false
      webhookUrl: ""
      username: ""
      password: ""
    teamsWebhookUrl: ""
    slackWebhookUrl: ""
    slackChannel: "#fraud-alerts"

# Kong declarative config: only the API's public routes are exposed; health,
# readiness and /metrics stay internal.
kongConfig: |
  _format_version: "3.0"
  services:
    - name: fraud-api
      url: http://api:8000
      routes:
        - name: transactions
          paths: [/api/v1/transactions]
          methods: [GET]
          strip_path: false
        - name: rule-sets
          paths: [/api/v1/rule-sets]
          methods: [GET, POST]
          strip_path: false
      plugins:
        - name: rate-limiting
          config:
            minute: 600
            limit_by: ip
            policy: local
        - name: request-size-limiting
          config:
            allowed_payload_size: 64
            size_unit: kilobytes
  plugins:
    - name: correlation-id
      config:
        header_name: x-correlation-id
        generator: uuid
        echo_downstream: true
