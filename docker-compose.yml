services:
  postgres:
    image: postgres:16-alpine
    container_name: fraud_postgres
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest
    container_name: fraud_kafka_broker
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-init:
    image: apache/kafka:latest
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - kafka
    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic ${KAFKA_TOPIC_NAME}
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic ${KAFKA_DLQ_TOPIC_NAME:-transactions_topic.dlq}

  worker:
    build: .
    container_name: fraud_worker
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: python -u -m app.worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_NAME: ${KAFKA_TOPIC_NAME}
      KAFKA_DLQ_TOPIC_NAME: ${KAFKA_DLQ_TOPIC_NAME:-${KAFKA_TOPIC_NAME}.dlq}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID}
      DATABASE_URL: ${DATABASE_URL}
      FRAUD_RULES_CONFIG_PATH: ${FRAUD_RULES_CONFIG_PATH}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS:-RS256}
      JWT_REQUIRED_SCOPE_FOR_TRANSACTION_READ: ${JWT_REQUIRED_SCOPE_FOR_TRANSACTION_READ:-fraud:transactions:read}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SSL_TRUSTSTORE_PATH: ${KAFKA_SSL_TRUSTSTORE_PATH:-}
      KAFKA_SSL_KEYSTORE_CERT_PATH: ${KAFKA_SSL_KEYSTORE_CERT_PATH:-}
      KAFKA_SSL_KEYSTORE_KEY_PATH: ${KAFKA_SSL_KEYSTORE_KEY_PATH:-}
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD:-}
      KAFKA_PRODUCER_ACKS: ${KAFKA_PRODUCER_ACKS:-all}
      KAFKA_PRODUCER_ENABLE_IDEMPOTENCE: ${KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:-true}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE}
      DEFAULT_HIGH_VALUE_THRESHOLD: ${DEFAULT_HIGH_VALUE_THRESHOLD}
      DEFAULT_RESTRICTED_CATEGORIES: ${DEFAULT_RESTRICTED_CATEGORIES}
      OBSERVABILITY_LOG_LEVEL: ${OBSERVABILITY_LOG_LEVEL:-INFO}
      OBSERVABILITY_ENABLE_TRACING: ${OBSERVABILITY_ENABLE_TRACING:-false}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9100}
    volumes:
      - type: bind
        source: ./rules.json
        target: /config/rules.json
        read_only: true
    ports:
      - "9100:9100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  api:
    build: .
    container_name: fraud_api
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_NAME: ${KAFKA_TOPIC_NAME}
      KAFKA_DLQ_TOPIC_NAME: ${KAFKA_DLQ_TOPIC_NAME:-${KAFKA_TOPIC_NAME}.dlq}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID}
      DATABASE_URL: ${DATABASE_URL}
      FRAUD_RULES_CONFIG_PATH: ${FRAUD_RULES_CONFIG_PATH}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS:-RS256}
      JWT_REQUIRED_SCOPE_FOR_TRANSACTION_READ: ${JWT_REQUIRED_SCOPE_FOR_TRANSACTION_READ:-fraud:transactions:read}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SSL_TRUSTSTORE_PATH: ${KAFKA_SSL_TRUSTSTORE_PATH:-}
      KAFKA_SSL_KEYSTORE_CERT_PATH: ${KAFKA_SSL_KEYSTORE_CERT_PATH:-}
      KAFKA_SSL_KEYSTORE_KEY_PATH: ${KAFKA_SSL_KEYSTORE_KEY_PATH:-}
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD:-}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE}
      DEFAULT_HIGH_VALUE_THRESHOLD: ${DEFAULT_HIGH_VALUE_THRESHOLD}
      DEFAULT_RESTRICTED_CATEGORIES: ${DEFAULT_RESTRICTED_CATEGORIES}
      OBSERVABILITY_LOG_LEVEL: ${OBSERVABILITY_LOG_LEVEL:-INFO}
      OBSERVABILITY_ENABLE_TRACING: ${OBSERVABILITY_ENABLE_TRACING:-false}
    volumes:
      - type: bind
        source: ./rules.json
        target: /config/rules.json
        read_only: true
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fraud_keycloak
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: start-dev
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: fraud_kafka_ui
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: Local-Fraud-Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

volumes:
  postgres_data: