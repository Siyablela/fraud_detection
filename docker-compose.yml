services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_detection"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: fraud_cache_broker
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-me}
    volumes:
      - redis_data:/data

  worker:
    build: .
    command: python -u -m app.worker
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me}@redis:6379
      - DATABASE_URL=postgresql://fraud_user:${POSTGRES_PASSWORD:-change-me}@postgres:5432/fraud_detection
      - FRAUD_RULES_CONFIG_PATH=/config/rules.json
    volumes:
      - ./rules.json:/config/rules.json:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me}@redis:6379
      - DATABASE_URL=postgresql://fraud_user:${POSTGRES_PASSWORD:-change-me}@postgres:5432/fraud_detection
      - FRAUD_RULES_CONFIG_PATH=/config/rules.json
    volumes:
      - ./rules.json:/config/rules.json:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  producer:
    build: .
    command: uvicorn app.producer:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me}@redis:6379
    depends_on:
      - redis

volumes:
  redis_data:
  postgres_data:
